{{- /* Text kommt aus site.Params.research (je Sprache in hugo.toml) */ -}}
{{- with site.Params.research -}}
<p class="bright">{{ .title }}</p>
<p>{{ .intro }}</p>
<div class="plist research">
{{- range .areas }}
<span class="bright">{{ .name }}</span><span>{{ .text }}{{ with .run }} <a href="#" data-run="{{ . }}">→ {{ . }}</a>{{ end }}{{ with .url }} <a href="{{ . }}">→ github</a>{{ end }}</span>
{{- end }}
</div>
<p class="dim">{{ .outro }} <a href="#" data-run="contact">contact</a></p>
{{- end -}}
