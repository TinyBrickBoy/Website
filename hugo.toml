[languages]
  [languages.en]
    languageCode = "en-US"
    languageName = "English"
    contentDir = "content/en"
    weight = 1
    [languages.en.params]
      role = "Developer & System Administrator"
      location = "Germany"
      description = "I build backends, run servers and networks, and automate everything that runs more than twice. Mostly Go, Java and Node.js — made with <3 and beer."
      status = "Working on OnThePixel.net, Steyon and localy.host"
      contributions = "1,167 contributions in the last year"
    [languages.en.params.research]
      title = "security & ip research"
      intro = "I run my own network, AS210881, and use it as a lab: how routes spread across the internet, how my prefixes are seen worldwide and what traffic actually hits a public IP range."
      outro = "Found something odd in my range or want to talk research?"
      [[languages.en.params.research.areas]]
        name = "bgp & routing"
        text = "announcing own prefixes, RPKI, upstreams and route visibility"
        run = "asn"
      [[languages.en.params.research.areas]]
        name = "ip intelligence"
        text = "geofeeds, whois/RDAP and the reputation of IP ranges"
        url = "https://github.com/TinyBrickBoy/geofeed"
      [[languages.en.params.research.areas]]
        name = "network security"
        text = "DDoS protection for game servers, packet filtering with XDP/eBPF, edge firewalls"
      [[languages.en.params.research.areas]]
        name = "tooling"
        text = "my own tools for routing and monitoring"
        run = "open bgp-router"

  [languages.de]
    languageCode = "de-DE"
    languageName = "Deutsch"
    contentDir = "content/de"
    weight = 2
    [languages.de.params]
      role = "Entwickler & Systemadministrator"
      location = "Deutschland"
      description = "Ich baue Backends, betreibe Server und Netzwerke und automatisiere alles, was öfter als zweimal läuft. Meist in Go, Java und Node.js — made with <3 and beer."
      status = "Arbeitet an OnThePixel.net, Steyon und localy.host"
      contributions = "1.167 Beiträge im letzten Jahr"
    [languages.de.params.research]
      title = "security- & ip-recherche"
      intro = "Ich betreibe mein eigenes Netz, AS210881, und nutze es als Labor: wie sich Routen im Internet verbreiten, wie meine Präfixe weltweit gesehen werden und welcher Traffic tatsächlich auf einem öffentlichen IP-Bereich ankommt."
      outro = "Etwas Seltsames in meinem Netz gefunden oder Lust auf Austausch?"
      [[languages.de.params.research.areas]]
        name = "bgp & routing"
        text = "eigene Präfixe announcen, RPKI, Upstreams und Sichtbarkeit von Routen"
        run = "asn"
      [[languages.de.params.research.areas]]
        name = "ip-intelligence"
        text = "Geofeeds, Whois/RDAP und die Reputation von IP-Bereichen"
        url = "https://github.com/TinyBrickBoy/geofeed"
      [[languages.de.params.research.areas]]
        name = "netzsicherheit"
        text = "DDoS-Schutz für Gameserver, Paketfilter mit XDP/eBPF, Firewalls am Netzrand"
      [[languages.de.params.research.areas]]
        name = "tooling"
        text = "eigene Werkzeuge für Routing und Monitoring"
        run = "open bgp-router"

