# Für Coolify (oder jedes andere Docker-Compose-Setup).
# In Coolify: Domain der Ressource auf Port 8080 zeigen lassen, z. B. https://leo.example.org:8080
# Die Variablen unten lassen sich in Coolify unter "Environment Variables" setzen.
services:
  web:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      # Optional: Container holt sich selbst neue Commits (z. B. die täglichen Stats).
      # Leer lassen, wenn Coolify bei jedem Push automatisch neu deployt.
      REPO_URL: "${REPO_URL:-}"
      REPO_BRANCH: "${REPO_BRANCH:-main}"
      UPDATE_INTERVAL: "${UPDATE_INTERVAL:-3600}"
      # Echte Adresse der Seite, z. B. https://leo.example.org/
      BASE_URL: "${BASE_URL:-}"
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/site:uid=10001,gid=10001,mode=0755
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
